<link rel="stylesheet" href="static/style.css">

<div style="display:flex;justify-content: center;">
  <form method="get" action="/search-filter" id="form-filter">
    <label>Title <input type="text" name="title" class="input-search"></label>
    <label>
      Category <select name="category" class="input-search">
        <option value="Film & Animation">Film & Animation</option>
        <option value="Autos & Vehicles">Autos & Vehicles</option>
        <option value="Music">Music</option>
        <option value="Pets & Animals">Pets & Animals</option>
        <option value="Sports">Sports</option>
        <option value="Short Movies">Short Movies</option>
        <option value="Travel & Events">Travel & Events</option>
        <option value="Gaming">Gaming</option>
        <option value="Videoblogging">Videoblogging</option>
        <option value="People & Blogs">People & Blogs</option>
        <option value="Comedy">Comedy</option>
        <option value="Entertainment">Entertainment</option>
        <option value="News & Politics">News & Politics</option>
        <option value="Howto & Style">Howto & Style</option>
        <option value="Education">Education</option>
        <option value="Science & Technology">Science & Technology</option>
        <option value="Nonprofits & Activism">Nonprofits & Activism</option>
        <option value="Movies">Movies</option>
        <option value="Anime/Animation">Anime/Animation</option>
        <option value="Action/Adventure">Action/Adventure</option>
        <option value="Classics">Classics</option>
        <option value="Comedy">Comedy</option>
        <option value="Documentary">Documentary</option>
        <option value="Drama">Drama</option>
        <option value="Family">Family</option>
        <option value="Foreign">Foreign</option>
        <option value="Horror">Horror</option>
        <option value="Sci-Fi/Fantasy">Sci-Fi/Fantasy</option>
        <option value="Thriller">Thriller</option>
        <option value="Shorts">Shorts</option>
        <option value="Shows">Shows</option>
        <option value="Trailers">Trailers</option>
        <option value="All" selected>All</option>
      </select>
    </label>
    <label>
      Channel <input type="text" name="channel" class="input-search">
    </label>
    <label>Since <input type="date" name="since" class="input-search"></label>
    <label>Until <input type="date" name="until" class="input-search"> </label>
    <label>
      Order <select name="order" class="input-search">
        <option value="ASC">ASC</option>
        <option value="DESC" selected>DESC</option>
      </select>
    </label>
  </form>

  <form method="get" action="/search-word" id="form-word" style="display:none;">
    <label>Content <input type="text" name="content" class="input-search"></label>
  </form>

  <button type="submit" form="form-filter" id="btn-search"><img src="static/imgs/search.png"></button>

  <input type="image" src="static/imgs/word.png" id="set-word" style="opacity:0.2;">
  <input type="image" src="static/imgs/filter.png" id="set-filter" style="opacity:1.0;">
</div>

<div id="videos"></div>

<div id="sentinel"></div>

<script src="static/main.js"></script>
